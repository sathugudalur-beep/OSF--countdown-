<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>OSF GENERAL BODY</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#0f172a,#1e293b);
color:white;padding:20px}.card{width:min(520px,100%);text-align:center;background:rgba(255,255,255,.09);
border:1px solid rgba(255,255,255,.15);border-radius:28px;padding:34px 22px;box-shadow:0 20px 60px #0006;
backdrop-filter:blur(12px)}.tag{font-size:13px;letter-spacing:3px;opacity:.7;margin-bottom:14px}.title{font-size:clamp(28px,8vw,48px);
font-weight:800;margin:0 0 26px}.label{font-size:14px;opacity:.65;letter-spacing:2px}.count{font-variant-numeric:tabular-nums;
font-size:clamp(48px,15vw,88px);font-weight:800;letter-spacing:2px;margin:8px 0 28px}.info{font-size:18px;line-height:1.8;
opacity:.9}.started{color:#86efac}.sub{font-size:13px;opacity:.55;margin-top:24px}
</style></head>
<body><main class="card">
<div class="tag">MEETING COUNTDOWN</div>
<h1 class="title">OSF GENERAL BODY</h1>
<div class="label" id="label">STARTS IN</div>
<div class="count" id="count">--:--:--</div>
<div class="info">📅 28 September 2026<br>⏰ 7:00 PM<br>📍 First Mile Madrasa</div>
<div class="sub">India Standard Time (IST)</div>
</main>
<script>
const target=new Date("2026-09-28T19:00:00+05:30").getTime();
function update(){
 let d=target-Date.now();
 const c=document.getElementById("count"), l=document.getElementById("label");
 if(d<=0){c.textContent="00:00:00";l.textContent="MEETING STARTED";c.className="count started";return}
 let s=Math.floor(d/1000),h=Math.floor(s/3600);s%=3600;
 let m=Math.floor(s/60);s%=60;
 c.textContent=[h,m,s].map(x=>String(x).padStart(2,"0")).join(":");
}
update();setInterval(update,1000);
</script></body></html>
